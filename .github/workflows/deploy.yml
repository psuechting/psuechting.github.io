name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # A stalled download should fail fast and be re-run, not hang for hours.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci

      # Chromium is needed only to print the CV PDF. Cache it per Playwright
      # version so the ~100 MB download happens once per upgrade, not every push.
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium (for the CV PDF)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        # No --with-deps: the runner image already has Chromium's shared libraries
        # (that flag only added ~21 MB of fonts). Retry with a per-attempt timeout
        # because the CDN occasionally stalls.
        run: |
          for attempt in 1 2 3; do
            if timeout 240 npx playwright install chromium-headless-shell; then
              exit 0
            fi
            echo "::warning::Chromium download attempt $attempt failed; retrying in 15s"
            sleep 15
          done
          echo "::error::Chromium download failed after 3 attempts"
          exit 1

      - name: Build site
        run: npm run build
      - name: Build CV PDF
        run: npm run build:cv
      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
